<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo oscuro -->
  <rect width="960" height="460" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Título del diagrama -->
  <text x="48" y="42" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1">ARQUITECTURA DEL SISTEMA Y PIPELINE MULTIPLATAFORMA</text>
  <text x="48" y="64" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Interconexión de microarquitectura 8-bit, sincronismo NTSC y capas de renderizado</text>

  <!-- ================= BLOQUE 1: NÚCLEO HARDWARE (pkg/) ================= -->
  <g transform="translate(48, 85)">
    <!-- Contenedor Maestro Machine -->
    <rect x="0" y="0" width="864" height="150" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="864" height="26" rx="6" fill="#1e293b"/>
    <text x="16" y="18" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1">MICROARQUITECTURA SEGA MASTER SYSTEM  (pkg/machine  •  228 CICLOS/LÍNEA  •  59.92 FPS)</text>

    <!-- Z80 CPU -->
    <rect x="18" y="42" width="260" height="92" rx="4" fill="#0b1120" stroke="#0284c7" stroke-width="1.2"/>
    <text x="32" y="66" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">CPU Zilog Z80</text>
    <text x="32" y="85" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Opcodes completos (CB, ED, DD, FD)</text>
    <text x="32" y="101" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Sega Mapper ($FFFD-$FFFF) + RAM 8KB</text>
    <text x="32" y="117" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Puertos I/O $DC-$DF (Mandos 1 y 2)</text>

    <!-- VDP (TMS9918A / 315-5124) -->
    <rect x="302" y="42" width="260" height="92" rx="4" fill="#0b1120" stroke="#d946ef" stroke-width="1.2"/>
    <text x="316" y="66" fill="#f0abfc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">VDP Modo 4 (16KB VRAM)</text>
    <text x="316" y="85" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• 32 Registros CRAM (2 paletas 16 colores)</text>
    <text x="316" y="101" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Sprites 8x8 / 8x16, Early Clock &amp; Zoom</text>
    <text x="316" y="117" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Scroll X/Y dinámico e IRQ de línea</text>

    <!-- PSG (SN76489) -->
    <rect x="586" y="42" width="260" height="92" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="1.2"/>
    <text x="600" y="66" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">PSG Audio (SN76489)</text>
    <text x="600" y="85" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• 3 Canales de Tono de onda cuadrada</text>
    <text x="600" y="101" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Generador de Ruido Blanco / Periódico</text>
    <text x="600" y="117" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Sincronización libre de clics a 48 kHz</text>
  </g>

  <!-- ================= BLOQUE 2: DSP & POST-PROCESADO ================= -->
  <g transform="translate(48, 252)">
    <!-- Pipeline Gráfico y Shaders -->
    <rect x="0" y="0" width="422" height="76" rx="6" fill="#131b2e" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="16" y="24" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">🎨 Shaders &amp; Filtros de Vídeo</text>
    <text x="16" y="45" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• CRT Scanlines analógicas adaptativas</text>
    <text x="16" y="61" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Scale2x EPX en tiempo real  •  Remaster 2026 OLED Glow</text>

    <!-- Pipeline Audio DSP -->
    <rect x="442" y="0" width="422" height="76" rx="6" fill="#132320" stroke="#10b981" stroke-width="1.2"/>
    <text x="458" y="24" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">🔊 Procesado Acústico DSP</text>
    <text x="458" y="45" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Filtro Paso Bajo IIR (calidez analógica de televisor)</text>
    <text x="458" y="61" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Pseudo-Estéreo Haas 3D  •  Reverberación de salón arcade</text>
  </g>

  <!-- ================= BLOQUE 3: ENTORNOS DE RELEASE ================= -->
  <g transform="translate(48, 346)">
    <!-- Linux -->
    <rect x="0" y="0" width="270" height="90" rx="6" fill="#182234" stroke="#475569" stroke-width="1.2"/>
    <text x="16" y="26" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">🐧 Linux Portable</text>
    <text x="16" y="48" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Binario bin/gosms-linux x86_64</text>
    <text x="16" y="66" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Selector dinámico de ROMs + Miniaturas</text>
    <text x="16" y="82" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10">dist/gosms-linux-release.zip</text>

    <!-- Windows -->
    <rect x="297" y="0" width="270" height="90" rx="6" fill="#182234" stroke="#475569" stroke-width="1.2"/>
    <text x="313" y="26" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">🪟 Windows 64-bit</text>
    <text x="313" y="48" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Binario nativo sin ventana de consola</text>
    <text x="313" y="66" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Soporte para mandos XInput / DirectInput</text>
    <text x="313" y="82" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10">dist/gosms-windows-release.zip</text>

    <!-- Android -->
    <rect x="594" y="0" width="270" height="90" rx="6" fill="#0d2822" stroke="#10b981" stroke-width="1.2"/>
    <text x="610" y="26" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">📱 Android APK</text>
    <text x="610" y="48" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• Controles virtuales táctiles integrados</text>
    <text x="610" y="66" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">• ROM embebida + Arquitecturas fat ARM/x86</text>
    <text x="610" y="82" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10">dist/gosms-android/gosms.apk</text>
  </g>
</svg>
