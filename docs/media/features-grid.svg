<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="960" height="210" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Columna 1: Precisión -->
  <g transform="translate(30, 25)">
    <rect width="205" height="160" rx="6" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="34" cy="36" r="16" fill="#0c4a6e"/>
    <text x="34" y="42" fill="#38bdf8" font-size="16" text-anchor="middle">🎯</text>
    <text x="60" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">99.7% Accuracy</text>
    <text x="18" y="76" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Matriz Z80 completa.</text>
    <text x="18" y="94" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Scroll-lock, IRQs de línea y</text>
    <text x="18" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">bancos Sega validados con</text>
    <text x="18" y="130" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">+350 títulos comerciales.</text>
  </g>

  <!-- Columna 2: Audio DSP -->
  <g transform="translate(260, 25)">
    <rect width="205" height="160" rx="6" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="34" cy="36" r="16" fill="#064e3b"/>
    <text x="34" y="42" fill="#10b981" font-size="16" text-anchor="middle">🔊</text>
    <text x="60" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">Audio DSP 48kHz</text>
    <text x="18" y="76" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Sincronismo PSG perfecto.</text>
    <text x="18" y="94" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Cero clics ni latencia.</text>
    <text x="18" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Filtro cálido analógico LPF,</text>
    <text x="18" y="130" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Haas 3D y Reverb Arcade.</text>
  </g>

  <!-- Columna 3: Post-procesado Gráfico -->
  <g transform="translate(490, 25)">
    <rect width="205" height="160" rx="6" fill="url(#cardBg)" stroke="#d946ef" stroke-width="1.2"/>
    <circle cx="34" cy="36" r="16" fill="#4a044e"/>
    <text x="34" y="42" fill="#d946ef" font-size="16" text-anchor="middle">📺</text>
    <text x="60" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">Shaders &amp; Filtros</text>
    <text x="18" y="76" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Scanlines CRT adaptativas,</text>
    <text x="18" y="94" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Scale2x EPX en tiempo real,</text>
    <text x="18" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Fósforo monocromo y</text>
    <text x="18" y="130" fill="#d946ef" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Shader Remaster 2026 OLED.</text>
  </g>

  <!-- Columna 4: Multiplataforma -->
  <g transform="translate(720, 25)">
    <rect width="210" height="160" rx="6" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="34" cy="36" r="16" fill="#451a03"/>
    <text x="34" y="42" fill="#f59e0b" font-size="16" text-anchor="middle">🚀</text>
    <text x="60" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">Release Universal</text>
    <text x="18" y="76" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Compilación en 1 comando:</text>
    <text x="18" y="94" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">🐧 Linux portable ZIP</text>
    <text x="18" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">🪟 Windows sin consola ZIP</text>
    <text x="18" y="130" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">📱 Android APK instalable.</text>
  </g>
</svg>
